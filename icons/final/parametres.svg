<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <title>Paramètres — M1 Profondeur</title>
  <defs>
    <clipPath id="sqc" clipPathUnits="objectBoundingBox">
      <path d="M.5,0 C.775,0 .898,.033 .943,.077 C.988,.122 1,.245 1,.5 C1,.755 .988,.878 .943,.923 C.898,.967 .775,1 .5,1 C.225,1 .102,.967 .057,.923 C.012,.878 0,.755 0,.5 C0,.245 .012,.122 .057,.077 C.102,.033 .225,0 .5,0 Z"></path>
    </clipPath>

    <path id="sqPath" d="M54,0 C83.7,0 97,3.56 101.8,8.32 C106.7,13.18 108,26.46 108,54 C108,81.54 106.7,94.82 101.8,99.68 C97,104.44 83.7,108 54,108 C24.3,108 11,104.44 6.16,99.68 C1.3,94.82 0,81.54 0,54 C0,26.46 1.3,13.18 6.16,8.32 C11,3.56 24.3,0 54,0 Z"></path>

    <!-- tuile M1 -->
    <linearGradient id="gTile1" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="98" y2="108">
      <stop offset="0" stop-color="#2A2C33"></stop>
      <stop offset=".55" stop-color="#17181C"></stop>
      <stop offset="1" stop-color="#0B0C0E"></stop>
    </linearGradient>

    <linearGradient id="gEdge" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="54" y2="70">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"></stop>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="gRed" gradientUnits="userSpaceOnUse" x1="24" y1="16" x2="88" y2="94">
      <stop offset="0" stop-color="#FF6178"></stop>
      <stop offset=".5" stop-color="#E5334E"></stop>
      <stop offset="1" stop-color="#A81232"></stop>
    </linearGradient>

    <linearGradient id="gGlyph" gradientUnits="userSpaceOnUse" x1="54" y1="30" x2="54" y2="80">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#BFC4CC"></stop>
    </linearGradient>

    <linearGradient id="gGlyphDim" gradientUnits="userSpaceOnUse" x1="54" y1="28" x2="54" y2="78">
      <stop offset="0" stop-color="#E2E6EB"></stop>
      <stop offset="1" stop-color="#A9AFB9"></stop>
    </linearGradient>

    <!-- PayPal : panses pleines, sans contrepoinçon. Trois tons — P arrière, P avant,
         et le recouvrement des deux, qui a sa propre teinte dans le logo d'origine.
         Dégradés en objectBoundingBox : la marque est posée dans un groupe transformé. -->
    <linearGradient id="gPpRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6178"></stop>
      <stop offset=".5" stop-color="#E5334E"></stop>
      <stop offset="1" stop-color="#A81232"></stop>
    </linearGradient>

    <linearGradient id="gPpWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#BFC4CC"></stop>
    </linearGradient>

    <!-- Les quatre couches de Wallet : gradation blanc → gris → rose → crimson,
         assez écartée en valeur pour que chaque bord reste lisible à 48 dp. -->
    <!-- Quadrichromie Gemini : une base bleue, puis trois nappes radiales ancrées
         sur les autres sommets. Approche le mélange bilinéaire de l'original,
         qu'un simple dégradé linéaire ne sait pas rendre. -->
    <radialGradient id="gemGreen" gradientUnits="userSpaceOnUse" cx="54" cy="100" r="48">
      <stop offset="0" stop-color="#12A150" stop-opacity="1"></stop>
      <stop offset=".45" stop-color="#12A150" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#12A150" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="gemYellow" gradientUnits="userSpaceOnUse" cx="6" cy="54" r="48">
      <stop offset="0" stop-color="#FFBB00" stop-opacity="1"></stop>
      <stop offset=".45" stop-color="#FFBB00" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#FFBB00" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="gemRed" gradientUnits="userSpaceOnUse" cx="54" cy="6" r="48">
      <stop offset="0" stop-color="#F0322A" stop-opacity="1"></stop>
      <stop offset=".45" stop-color="#F0322A" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#F0322A" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Famille sociale : nappe jaune-orangé en diagonale, plus un halo clair
         en haut à gauche qui donne le fondu soyeux des fonds d'écran fournis. -->
    <linearGradient id="orBase" gradientUnits="userSpaceOnUse" x1="8" y1="2" x2="100" y2="106">
      <stop offset="0" stop-color="#FFE93B"></stop>
      <stop offset=".3" stop-color="#FFC400"></stop>
      <stop offset=".64" stop-color="#FF8A00"></stop>
      <stop offset="1" stop-color="#F0490A"></stop>
    </linearGradient>

    <radialGradient id="orBloom" gradientUnits="userSpaceOnUse" cx="33" cy="28" r="56">
      <stop offset="0" stop-color="#FFF6B0" stop-opacity=".8"></stop>
      <stop offset=".45" stop-color="#FFD84A" stop-opacity=".3"></stop>
      <stop offset="1" stop-color="#FFD84A" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Famille système : trois valeurs de blanc, pour séparer les plans d'un
         même dessin sans introduire de couleur. -->
    <linearGradient id="gS1" gradientUnits="userSpaceOnUse" x1="54" y1="18" x2="54" y2="92">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#D6DAE1"></stop>
    </linearGradient>

    <linearGradient id="gS2" gradientUnits="userSpaceOnUse" x1="54" y1="18" x2="54" y2="92">
      <stop offset="0" stop-color="#C7CDD6"></stop>
      <stop offset="1" stop-color="#9BA2AD"></stop>
    </linearGradient>

    <linearGradient id="gS3" gradientUnits="userSpaceOnUse" x1="54" y1="18" x2="54" y2="92">
      <stop offset="0" stop-color="#848B96"></stop>
      <stop offset="1" stop-color="#5E656F"></stop>
    </linearGradient>

    <clipPath id="sqSelf" clipPathUnits="userSpaceOnUse">
      <use href="#sqPath"></use>
    </clipPath>

    <!-- Famille verte : même construction que l'orangé — une diagonale du citron
         vert au vert profond, plus un halo clair en haut à gauche. Les teintes sont
         relevées sur les fonds d'écran fournis. -->
    <linearGradient id="vtBase" gradientUnits="userSpaceOnUse" x1="8" y1="2" x2="100" y2="106">
      <stop offset="0" stop-color="#7BFF4D"></stop>
      <stop offset=".32" stop-color="#23DE33"></stop>
      <stop offset=".66" stop-color="#0FA02A"></stop>
      <stop offset="1" stop-color="#06561A"></stop>
    </linearGradient>

    <radialGradient id="vtBloom" gradientUnits="userSpaceOnUse" cx="33" cy="28" r="56">
      <stop offset="0" stop-color="#D6FFB4" stop-opacity=".78"></stop>
      <stop offset=".45" stop-color="#63F05A" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#63F05A" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="vtFold" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="92" y2="96">
      <stop offset="0" stop-color="#0C7A24"></stop>
      <stop offset="1" stop-color="#03330E"></stop>
    </linearGradient>

    <clipPath id="holder" clipPathUnits="userSpaceOnUse">
      <rect x="18" y="28" width="72" height="56" rx="9"></rect>
    </clipPath>

    <linearGradient id="gHold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A81433"></stop>
      <stop offset="1" stop-color="#67091E"></stop>
    </linearGradient>

    <linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1F4"></stop>
      <stop offset="1" stop-color="#F8C9D5"></stop>
    </linearGradient>

    <linearGradient id="gW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#EDEFF3"></stop>
    </linearGradient>

    <linearGradient id="gW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2BAC5"></stop>
      <stop offset="1" stop-color="#8F98A4"></stop>
    </linearGradient>

    <linearGradient id="gPpOver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEDCE3"></stop>
      <stop offset="1" stop-color="#F0A6B5"></stop>
    </linearGradient>

    <clipPath id="ppFront" clipPathUnits="userSpaceOnUse">
      <path transform="translate(13,12)" d="M0 0 L23 0 A15 15 0 0 1 23 30 L13 30 L13 50 L0 50 Z"></path>
    </clipPath>

    <clipPath id="cutA" clipPathUnits="userSpaceOnUse">
      <polygon points="144.5,-47.1 -34.5,155.1 115.7,288.1 294.7,85.9"></polygon>
    </clipPath>
    <clipPath id="cutB" clipPathUnits="userSpaceOnUse">
      <polygon points="144.5,-47.1 -34.5,155.1 -184.7,22.1 -5.7,-180.1"></polygon>
    </clipPath>
  <clipPath id="sqUser" clipPathUnits="userSpaceOnUse"><use href="#sqPath"/></clipPath></defs>
  <g clip-path="url(#sqUser)"><rect width="108" height="108" fill="url(#gTile1)"/><path d="M76.95 46.98 L88.36 47.32 L88.36 60.68 L76.95 61.02 L75.19 65.27 L83.02 73.57 L73.57 83.02 L65.27 75.19 L61.02 76.95 L60.68 88.36 L47.32 88.36 L46.98 76.95 L42.73 75.19 L34.43 83.02 L24.98 73.57 L32.81 65.27 L31.05 61.02 L19.64 60.68 L19.64 47.32 L31.05 46.98 L32.81 42.73 L24.98 34.43 L34.43 24.98 L42.73 32.81 L46.98 31.05 L47.32 19.64 L60.68 19.64 L61.02 31.05 L65.27 32.81 L73.57 24.98 L83.02 34.43 L75.19 42.73 Z M54 42 A12 12 0 1 0 54 66 A12 12 0 1 0 54 42 Z" fill-rule="evenodd" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><use href="#sqPath" fill="none" stroke="url(#gEdge)" stroke-width="2.6"/></g>
</svg>